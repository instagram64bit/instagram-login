<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مرحباً</title>
<style>
    body {
        background: #000;
        color: #fff;
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .box { text-align: center; padding: 40px; }
    h1 { font-size: 32px; margin-bottom: 20px; }
    .logout {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 30px;
        background: #0064e0;
        color: #fff;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
    }
    .logout:hover { background: #0052b8; }
</style>
</head>
<body>
    <div class="box">
        <h1>مرحباً، {{ username }}! 👋</h1>
        <p style="color: #737373;">تم تسجيل دخولك بنجاح</p>
        <a href="/logout" class="logout">تسجيل الخروج</a>
    </div>
</body>
</html>
